<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validor — data flow</title>
<style>
  body {
    margin: 0;
    padding: 48px 24px;
    background: #060a12;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* ── Component ─────────────────────────────────────────────
     Everything below is scoped to .validor-flow.
     Fonts inherit from your page unless you set --vf-font-*.
     ────────────────────────────────────────────────────────── */
  .validor-flow {
    --vf-bg: #080d18;
    --vf-grid: #111a2e;

    --vf-card: #0f1729;
    --vf-card-border: #213558;
    --vf-title: #e8eefb;
    --vf-sub: #7e93b5;

    --vf-blue: #4d9fff;
    --vf-blue-arrow: #3d6da8;

    --vf-purple: #a78bfa;
    --vf-purple-text: #b9a6fb;
    --vf-purple-card: #14112a;
    --vf-purple-border: #3d3277;
    --vf-purple-sub: #9a8bc9;
    --vf-purple-title: #efeafd;
    --vf-purple-arrow: #6d5bc4;
    --vf-purple-bold: #8b6ef0;
    --vf-chip-bg: #141031;
    --vf-pill-bg: #171232;
    --vf-pill-border: #4a3a8c;

    --vf-amber: #f0a63a;
    --vf-amber-text: #eda94a;
    --vf-amber-card: #14100a;
    --vf-amber-border: #5a441d;
    --vf-amber-rule: #4a3818;
    --vf-amber-body: #c4b193;
    --vf-amber-arrow: #8a6a2e;

    --vf-font-sans: inherit;
    --vf-font-mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;

    max-width: 680px;
    margin: 0 auto;
    overflow-x: auto;
  }
  .validor-flow svg { display: block; width: 100%; min-width: 560px; height: auto; }

  .vf-eyebrow { font-family: var(--vf-font-mono); font-size: 11px; letter-spacing: 1px; }
  .vf-mono    { font-family: var(--vf-font-mono); font-size: 11px; }
  .vf-title   { font-family: var(--vf-font-sans); font-size: 14px; font-weight: 500; fill: var(--vf-title); }
  .vf-sub     { font-family: var(--vf-font-sans); font-size: 12px; fill: var(--vf-sub); }

  .vf-card    { fill: var(--vf-card); stroke: var(--vf-card-border); stroke-width: .5; }
  .vf-arrow   { stroke: var(--vf-blue-arrow); stroke-width: 1.5; }

  .vf-ai-card  { fill: var(--vf-purple-card); stroke: var(--vf-purple-border); stroke-width: .5; }
  .vf-ai-title { font-family: var(--vf-font-sans); font-size: 14px; font-weight: 500; fill: var(--vf-purple-title); }
  .vf-ai-sub   { font-family: var(--vf-font-sans); font-size: 12px; fill: var(--vf-purple-sub); }
  .vf-ai-arrow { stroke: var(--vf-purple-arrow); stroke-width: 1.5; }

  .vf-chip      { fill: var(--vf-chip-bg); stroke: var(--vf-purple-border); stroke-width: .5; }
  .vf-chip-text { fill: var(--vf-purple-text); }

  .vf-audit-card { fill: var(--vf-amber-card); stroke: var(--vf-amber-border); stroke-width: .5; stroke-dasharray: 4 3; }
  .vf-audit-body { font-family: var(--vf-font-sans); font-size: 12px; fill: var(--vf-amber-body); }
  .vf-audit-arrow { stroke: var(--vf-amber-arrow); stroke-width: 1.5; }
</style>
</head>
<body>

<div class="validor-flow">
<svg viewBox="0 0 680 400" role="img" aria-labelledby="vf-title vf-desc">
  <title id="vf-title">Validor data flow</title>
  <desc id="vf-desc">A deterministic pipeline parses, validates, normalizes and persists every lab result. De-identified data crosses into a governed AI layer, where retrieval of clinical guidelines and patient history feeds AI annotation and a patient message draft that needs clinician approval. An append-only, timestamped audit log records events from every stage of both lanes.</desc>

  <defs>
    <marker id="vf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="vf-arrow-bold" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="vf-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0V40M0 40H40" fill="none" stroke="var(--vf-grid)" stroke-width=".5"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="680" height="400" rx="12" fill="var(--vf-bg)"/>
  <rect x="0" y="0" width="680" height="400" rx="12" fill="url(#vf-grid)"/>

  <text class="vf-eyebrow" x="40" y="56" fill="var(--vf-blue)">DETERMINISTIC PIPELINE: FROM RAW CSV</text>

  <rect class="vf-card" x="40" y="72" width="94" height="56" rx="10"/>
  <text class="vf-title" x="87" y="94" text-anchor="middle" dominant-baseline="central">Parse</text>
  <text class="vf-sub" x="87" y="112" text-anchor="middle" dominant-baseline="central">CSV rows</text>
  <line class="vf-arrow" x1="136" y1="100" x2="153" y2="100" marker-end="url(#vf-arrow)"/>

  <rect class="vf-card" x="155" y="72" width="94" height="56" rx="10"/>
  <text class="vf-title" x="202" y="94" text-anchor="middle" dominant-baseline="central">Validate</text>
  <text class="vf-sub" x="202" y="112" text-anchor="middle" dominant-baseline="central">Rule checks</text>
  <line class="vf-arrow" x1="251" y1="100" x2="268" y2="100" marker-end="url(#vf-arrow)"/>

  <rect class="vf-card" x="270" y="72" width="94" height="56" rx="10"/>
  <text class="vf-title" x="317" y="94" text-anchor="middle" dominant-baseline="central">Normalize</text>
  <text class="vf-sub" x="317" y="112" text-anchor="middle" dominant-baseline="central">FHIR map</text>
  <line class="vf-arrow" x1="366" y1="100" x2="383" y2="100" marker-end="url(#vf-arrow)"/>

  <rect class="vf-card" x="385" y="72" width="94" height="56" rx="10"/>
  <text class="vf-title" x="432" y="94" text-anchor="middle" dominant-baseline="central">Persist</text>
  <text class="vf-sub" x="432" y="112" text-anchor="middle" dominant-baseline="central">Reports, obs</text>

  <text class="vf-eyebrow" x="568" y="56" text-anchor="middle" fill="var(--vf-amber)">AUDIT LOG</text>
  <rect class="vf-audit-card" x="496" y="72" width="144" height="250" rx="10"/>
  <text class="vf-mono" x="568" y="100" text-anchor="middle" dominant-baseline="central" fill="var(--vf-amber-text)">append-only</text>
  <text class="vf-mono" x="568" y="120" text-anchor="middle" dominant-baseline="central" fill="var(--vf-amber-text)">timestamped</text>
  <line x1="516" y1="142" x2="620" y2="142" stroke="var(--vf-amber-rule)" stroke-width=".5"/>
  <text class="vf-audit-body" x="568" y="168" text-anchor="middle" dominant-baseline="central">Records events</text>
  <text class="vf-audit-body" x="568" y="186" text-anchor="middle" dominant-baseline="central">for every stage</text>
  <text class="vf-audit-body" x="568" y="204" text-anchor="middle" dominant-baseline="central">of the pipeline,</text>
  <text class="vf-audit-body" x="568" y="222" text-anchor="middle" dominant-baseline="central">end-to-end</text>
  <line class="vf-audit-arrow" x1="481" y1="100" x2="494" y2="100" marker-end="url(#vf-arrow)"/>
  <line class="vf-audit-arrow" x1="481" y1="290" x2="494" y2="290" marker-end="url(#vf-arrow)"/>

  <line x1="267" y1="142" x2="267" y2="244" stroke="var(--vf-purple-bold)" stroke-width="3" stroke-linecap="round" marker-end="url(#vf-arrow-bold)"/>
  <rect x="282" y="179" width="150" height="28" rx="14" fill="var(--vf-pill-bg)" stroke="var(--vf-pill-border)" stroke-width=".5"/>
  <text class="vf-mono" x="357" y="194" text-anchor="middle" dominant-baseline="central" fill="var(--vf-purple-text)">de-identified data</text>

  <text class="vf-eyebrow" x="40" y="240" fill="var(--vf-purple)">GOVERNED AI LAYER</text>

  <rect class="vf-card" x="40" y="262" width="136" height="60" rx="10"/>
  <text class="vf-title" x="108" y="281" text-anchor="middle" dominant-baseline="central">Retrieval</text>
  <text class="vf-sub" x="108" y="299" text-anchor="middle" dominant-baseline="central">RAG guidelines</text>
  <text class="vf-sub" x="108" y="314" text-anchor="middle" dominant-baseline="central">+ history query</text>
  <line class="vf-ai-arrow" x1="178" y1="290" x2="202" y2="290" marker-end="url(#vf-arrow)"/>

  <rect class="vf-ai-card" x="204" y="262" width="126" height="56" rx="10"/>
  <text class="vf-ai-title" x="267" y="284" text-anchor="middle" dominant-baseline="central">AI annotation</text>
  <text class="vf-ai-sub" x="267" y="302" text-anchor="middle" dominant-baseline="central">Priority + trend</text>
  <line class="vf-ai-arrow" x1="332" y1="290" x2="356" y2="290" marker-end="url(#vf-arrow)"/>

  <rect class="vf-ai-card" x="358" y="262" width="121" height="56" rx="10"/>
  <text class="vf-ai-title" x="418" y="284" text-anchor="middle" dominant-baseline="central">Message draft</text>
  <text class="vf-ai-sub" x="418" y="302" text-anchor="middle" dominant-baseline="central">Needs approval</text>

  <path d="M108 322 L108 338 L418 338 L418 320" fill="none" stroke="#3c3470" stroke-width=".5" stroke-dasharray="3 3" marker-end="url(#vf-arrow)"/>

  <rect class="vf-chip" x="40" y="356" width="116" height="26" rx="6"/>
  <text class="vf-mono vf-chip-text" x="98" y="370" text-anchor="middle" dominant-baseline="central">RAG guidelines</text>

  <rect class="vf-chip" x="168" y="356" width="110" height="26" rx="6"/>
  <text class="vf-mono vf-chip-text" x="223" y="370" text-anchor="middle" dominant-baseline="central">History query</text>

  <rect class="vf-chip" x="290" y="356" width="123" height="26" rx="6"/>
  <text class="vf-mono vf-chip-text" x="351" y="370" text-anchor="middle" dominant-baseline="central">Schema-verified</text>

  <rect class="vf-chip" x="425" y="356" width="136" height="26" rx="6"/>
  <text class="vf-mono vf-chip-text" x="493" y="370" text-anchor="middle" dominant-baseline="central">Clinician sign-off</text>
</svg>
</div>

</body>
</html>
